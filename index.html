<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO tags -->
    <title>Shoppinng Store | Quality Products Online</title>
    <meta name="description" content="Shop the best selection of [your niche — e.g. handmade jewelry, sustainable fashion] at Shopping Store. Fast shipping, secure checkout, easy returns." />
    <meta name="keywords" content="online store, buy online, ecommerce, [your key product categories]" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shopping Store | Quality Products Online" />
    <meta property="og:description" content="Shop the best selection of tech at Shopping Store. Fast shipping, secure checkout, easy returns." />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="Shopping Store" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shopping Store | Quality Products Online" />
    <meta name="twitter:description" content="Shop the best selection of [your niche] at ShoppingStore. Fast shipping, secure checkout, easy returns." />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.jpg" />

    <!-- Theme color for mobile browser chrome -->
    <meta name="theme-color" content="#1a1a1a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
